name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -A x64 -DACID_BUILD_TESTS=ON 2>&1 | tee configure.log; exit ${PIPESTATUS[0]}

      - name: Build VST3 and tests
        shell: bash
        run: cmake --build build --config Release --target Acid_VST3 AcidTests --parallel 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        shell: bash
        run: ./build/Release/AcidTests.exe --reporter compact

      # The zipped plugin goes to a "builds" branch (fetched with git) instead of
      # Actions artifacts, so it never counts against the artifact storage quota.
      - name: Publish VST3 to builds branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir out
          cd build/Acid_artefacts/Release/VST3
          7z a -tzip "$GITHUB_WORKSPACE/out/ACID-VST3-Windows-x64.zip" "Acid.vst3"
          cd "$GITHUB_WORKSPACE/out"
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Plugin builds ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Validate with pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 900000 \
            "build/Acid_artefacts/Release/VST3/Acid.vst3" 2>&1 | tee pluginval.log
          exit ${PIPESTATUS[0]}

      # Logs are only kept when something goes wrong, and only for a few days.
      - name: Upload logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          retention-days: 3
          path: |
            configure.log
            build.log
            pluginval.log
            build/CMakeFiles/CMakeConfigureLog.yaml
